<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d0e15">
<title>VSITE · Discover great videos</title>
<link rel="stylesheet" href="/static/css/app.css">
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <a class="brand" href="#/">
      <span class="brand-logo">V</span>
      <span class="brand-text">VSITE</span>
    </a>
    <form class="search-box" id="search-form" autocomplete="off">
      <input type="search" id="search-input" placeholder="Search videos, creators…">
      <button type="submit" aria-label="Search">Search</button>
    </form>
    <nav class="topnav">
      <a href="#/" data-nav="home">For You</a>
      <a href="#/bloggers" data-nav="bloggers">Creators</a>
      <a class="btn-admin" href="/admin">Login</a>
    </nav>
  </div>
</header>

<main id="app">
  <!-- Home / search results -->
  <section id="home-view" class="view">
    <div class="hero">
      <h1 id="hero-title">Discover great videos</h1>
      <p id="hero-sub">Scroll down for more — every screen is different</p>
    </div>
    <div id="feed" class="masonry"></div>
    <div id="loader" class="loader"><span class="spinner"></span>Loading…</div>
    <div id="feed-end" class="feed-end" hidden>You've reached the end — check out other creators!</div>
  </section>

  <!-- Creator page -->
  <section id="blogger-view" class="view" hidden>
    <div class="blogger-head" id="blogger-head"></div>
    <div id="blogger-feed" class="masonry"></div>
    <div id="blogger-loader" class="loader"><span class="spinner"></span>Loading…</div>
    <div id="blogger-end" class="feed-end" hidden>That's all from this creator~</div>
  </section>

  <!-- Creators directory -->
  <section id="bloggers-view" class="view" hidden>
    <div class="hero"><h1>Creators</h1><p>Tap a profile to see all of their videos</p></div>
    <div id="blogger-list" class="blogger-grid"></div>
  </section>
</main>

<!-- Comment sheet -->
<div id="comment-mask" class="mask" hidden></div>
<div id="comment-sheet" class="sheet" hidden>
  <div class="sheet-head">
    <strong id="comment-title">Comments</strong>
    <button class="sheet-close" id="comment-close" aria-label="Close">×</button>
  </div>
  <div id="comment-list" class="comment-list"></div>
  <form id="comment-form" class="comment-form">
    <input type="text" id="comment-nick" maxlength="24" placeholder="Nickname (optional)">
    <textarea id="comment-content" maxlength="200" rows="2" placeholder="Say something…"></textarea>
    <button type="submit">Send</button>
  </form>
</div>

<div id="toast" class="toast" hidden></div>

<script src="/static/js/app.js"></script>
</body>
</html>
